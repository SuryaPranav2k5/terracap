[project]
name = "image-recognition"
version = "0.1.0"
description = "NWPU-Caption remote sensing image recognition and captioning benchmark"
readme = "README.md"
authors = [
    { name = "Surya Pranav", email = "pranavsurya123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "peft>=0.21.2",
    "pillow>=13.0.0",
    "pycocoevalcap>=1.2",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
